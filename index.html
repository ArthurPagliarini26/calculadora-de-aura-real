    <!-- Suspense: aparece por 5 segundos antes do resultado -->
    <section id="carregando" hidden aria-live="polite">
        <div class="orbe"></div>
        <p id="carregando-texto">Lendo sua presença...</p>
        <div class="barra"><div id="barra-progresso"></div></div>
        <p id="carregando-numero">--.-</p>
    </section>

    <!-- Resultado: escondido até o cálculo terminar -->
    <section id="resultado" hidden aria-live="polite">
        <h2>RESULTADO</h2>
        <p>Aura: <span id="aura">0</span> / 100</p>
        <p>Nível: <span id="nivel">---</span></p>
    </section>

<!-- Efeitos da explosão -->
<div id="flash"></div>
<canvas id="explosao"></canvas>

<script src="calculadoraAura.js"></script>
